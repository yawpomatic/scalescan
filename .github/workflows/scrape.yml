name: Scrape Ministry of Hobby

on:
  # Una vez al día, pensado para las 07:00 hora de España.
  # GitHub Actions usa UTC y no ajusta el cambio de hora automáticamente:
  # 06:00 UTC = 07:00 en horario de invierno (CET) / 08:00 en verano (CEST).
  # Si quieres que sea siempre puntual a las 7:00 en España, cambia este
  # número a 05 cuando entre el horario de verano (finales de marzo) y
  # vuelve a 06 cuando entre el de invierno (finales de octubre).
  schedule:
    - cron: "0 6 * * *"
  # También se puede lanzar a mano desde la pestaña "Actions" de GitHub
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scrapers/requirements.txt

      - name: Ejecutar el scraper de Ministry of Hobby
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python ministryofhobby.py
